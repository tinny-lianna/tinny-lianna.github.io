name: Publish parent reviews

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch reviews from Formspree
        env:
          FORMSPREE_API_KEY: ${{ secrets.FORMSPREE_API_KEY }}
        run: python scripts/publish_reviews.py
      - name: Publish changed reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git diff --cached --quiet || (git commit -m "Update published parent reviews" && git push)
